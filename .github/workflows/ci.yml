name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The apt-repo route needs `apt-key`, which Ubuntu 26.04 (the current
      # ubuntu-latest image) no longer ships: the step died with
      # `sudo: 'apt-key': command not found` on every run from 2026-11-14 on,
      # including runs whose diff touched no workflow. The upstream install
      # script is distro-agnostic and pins nothing to a release codename.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run precommit checks
        run: make precommit
