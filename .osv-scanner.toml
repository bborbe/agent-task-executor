# Read by `make osv-scanner` (passed as --config). Empty until now, so the scan
# reported every advisory.
#
# Every GO-2026-6xxx entry below is a **Go 1.27.1 stdlib** advisory whose fix
# ships in Go 1.27.2. The fix is not applicable here yet, and the block is a
# tool, not an oversight: bumping this repo's `go` directive to 1.27.2 cannot
# pass `make precommit`, because gosec v2.29.0 — the newest release — cannot
# type-check a 1.27.2 module. 24 packages fail SSA analysis with
# `export data version 5 is greater than maximum supported version 4`,
# reproduced with a clean GOCACHE and the toolchain pinned; gosec's `-no-fail`
# would only mask that while silently degrading the scan to its non-SSA
# findings. golangci-lint v2.14.0 (v2.13.1 fails the same way) and the
# retirement of the standalone `errcheck:` target are both required by that same
# bump, and are deferred with it.
#
# The x/net advisories that appeared in the same scans ARE fixed here, by the
# golang.org/x/net v0.58.0 -> v0.60.0 bump — x/net v0.60.0 needs only Go 1.26,
# so it is independent of this block.
#
# The same IDs are listed in Makefile.precommit's VULNCHECK_IGNORE: govulncheck
# and osv-scanner have separate ignore mechanisms, and both must be cleared.
#
# REMOVE these entries once gosec supports Go 1.27.2 and the `go` directive here
# moves to it. See coding/docs/go-tools-versioning-guide.md
# § "Adding a transient stdlib OSV ignore".

